    <h1>図書館を利用する前の確認</h1>
      <h2>出かける前に</h2>
        <p>利用する日の情報を、<a href="https://appsv.main.teikyo-u.ac.jp/tosho/tos.html">図書館の公式サイト</a>で確認しましょう。</p>
      <h2>確認すること</h2>
        <ul>
          <li><a href="index.html#hours">開館日と開館時間</a>を確認する。</li>
          <li>利用したいサービスの案内を確認する。</li>
          <li>必要な持ち物を確認する。</li>
        </ul>
      <h2>確認の手順</h2>
        <ol>
          <li><a href="https://appsv.main.teikyo-u.ac.jp/tosho/tos.html">図書館の公式サイト</a>を開く。</li>
          <li>利用したいサービスの案内を探す。</li>
          <li>分からないことがあれば、問い合わせ方法を確認する。</li>
        </ol>
      <h2>利用案内に戻る</h2>
        <p>図書館の利用案内のページに戻ります。</p>
        <p><a href="index.html">図書館の利用案内に戻る</a></p>
        <p>※このページは授業用の例です。実際の利用条件は、<a href="https://appsv.main.teikyo-u.ac.jp/tosho/tos.html">図書館の公式サイト</a>で確認してください。</p>
